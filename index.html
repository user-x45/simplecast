<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SimpleCast｜ブラウザで画面を共有</title>
<meta name="description" content="ブラウザだけでPCの画面と音声を別の端末にリアルタイム共有できます。6文字のコードを入力するだけで、すぐにつながります。">
<meta name="robots" content="noindex, nofollow">
<link href="favicon/32.png" rel="icon" sizes="32x32" type="image/png">
<link href="favicon/96.png" rel="icon" sizes="96x96" type="image/png">
<link href="favicon/144.png" rel="icon" sizes="144x144" type="image/png">
<link href="favicon/192.png" rel="icon" sizes="192x192" type="image/png">
<link href="favicon/512.png" rel="icon" sizes="512x512" type="image/png">
<link href="favicon/180.png" rel="apple-touch-icon" type="image/png">
<link href="favicon/152.png" rel="apple-touch-icon-precomposed" type="image/png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5;--surface:#FFFFFF;--ink:#0F1728;--sub:#5B667A;--line:#D9DEE8;
  --accent:#2B3BFF;--accent-ink:#FFFFFF;--tile:#0F1728;--tile-ink:#F4F6FB;
  --ok:#0E9F6E;--ng:#E0453A;--stage:#070A12;--soft:#F4F6FA;
  --display:"Bricolage Grotesque","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#090D16;--surface:#111827;--ink:#F1F4FA;--sub:#93A0B8;--line:#222C40;--accent:#6373FF;--tile:#1C2842;--stage:#04060B;--soft:#172033}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;height:100dvh;overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.shell{max-width:1600px;height:100%;margin:0 auto;padding:clamp(12px,2.4vh,20px) 20px clamp(12px,2.4vh,20px);display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(10px,2.4vh,20px);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand .site-icon{font-size:30px;line-height:1;color:var(--accent);flex:none}

.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.install{display:none;align-items:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.install.show{display:inline-flex}
.install:hover{background:var(--soft)}
.install i{color:var(--accent)}
.switch{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg{border:0;background:transparent;padding:9px 22px;border-radius:999px;font-size:14px;font-weight:500;color:var(--sub);cursor:pointer;transition:background .2s,color .2s}
.seg[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.panel{display:none}
.panel.active{display:flex;flex-direction:column;flex:1;min-height:0}
#sender.active{justify-content:center;padding-bottom:6vh}
#sender .card{width:100%;max-width:760px;margin:0 auto}
#viewer.active{gap:clamp(10px,2vh,16px)}
.vcard{display:flex;align-items:center;gap:clamp(16px,3vw,36px);flex-wrap:wrap;padding:clamp(12px,2.4vh,20px) clamp(16px,2.4vw,28px)}
.vcard .vinfo{flex:1 1 240px;min-width:0}
.vcard .lead{margin:0}
.vcard .tile{width:clamp(36px,4vw,52px);height:clamp(48px,5.6vw,72px)}
.vcard .tile b{font-size:clamp(24px,3vw,38px)}
.vcard .row{margin-top:0;flex:none;flex-direction:column;align-items:stretch;gap:8px}
#viewer.live .vcard{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(16px,3.2vh,32px) clamp(18px,3vw,36px);flex:none}
.card h2{font-family:var(--display);font-size:clamp(20px,3.4vh,30px);line-height:1.25;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.lead{margin:0 0 clamp(12px,2.4vh,24px);color:var(--sub);font-size:14px;max-width:38em}

.tiles{display:flex;gap:clamp(6px,1.6vw,12px)}
.tile{position:relative;width:clamp(38px,min(11.5vw,8vh),64px);height:clamp(52px,min(16vw,11.5vh),90px);background:var(--tile);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.4);pointer-events:none}
.tile b,.tile input{font-family:var(--display);font-weight:800;font-size:clamp(28px,min(8.6vw,6.6vh),50px);color:var(--tile-ink);text-transform:uppercase;line-height:1}
.tile b:empty::before{content:"–";opacity:.3}
.tile input{width:100%;height:100%;background:transparent;border:0;text-align:center;padding:0;margin:0;outline:none;caret-color:var(--accent)}
.tile:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.tile.flip{animation:flip .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{transform:perspective(500px) rotateX(-90deg);opacity:0}to{transform:perspective(500px) rotateX(0);opacity:1}}

.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:clamp(12px,2.4vh,22px)}
.pill{display:inline-flex;align-items:center;gap:9px;background:var(--soft);border-radius:999px;padding:8px 16px 8px 14px;font-size:14px;color:var(--sub)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none}
.dot.ok{background:var(--ok)}
.dot.ng{background:var(--ng)}
.dot.ok.pulse{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,159,110,.5)}100%{box-shadow:0 0 0 9px rgba(14,159,110,0)}}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.ghost:hover:not(:disabled){background:var(--soft)}
.ghost:disabled{opacity:.4;cursor:default}

.main{border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:700;padding:0 32px;height:54px;cursor:pointer;transition:transform .15s,opacity .2s}
.main:active:not(:disabled){transform:scale(.98)}
.main:disabled{opacity:.5;cursor:default}
.main.stop{background:var(--ng)}

.stage{position:relative;container-type:size;margin-top:0;flex:1;min-width:0;min-height:120px;background:var(--stage);border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.stage.live video{opacity:1}
.stage.rot90 video,.stage.rot270 video{inset:auto;top:50%;left:50%;width:100cqh;height:100cqw}
.stage.rot90 video{transform:translate(-50%,-50%) rotate(90deg)}
.stage.rot270 video{transform:translate(-50%,-50%) rotate(270deg)}
.stage.rot180 video{transform:rotate(180deg)}
.hold{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;color:#8A95AB}
.ctl{position:absolute;right:14px;bottom:14px;display:none;gap:8px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .25s,transform .25s}
.stage.live .ctl{display:flex}
.stage.live.show-ctl .ctl,.stage.live .ctl:focus-within{opacity:1;transform:none;pointer-events:auto}
.stage.live:not(.show-ctl){cursor:none}
.ctl button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(10,14,24,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.ctl button:hover{background:rgba(10,14,24,.85)}
.ctl svg{width:22px;height:22px}
#fsBtn .exit{display:none}
#fsBtn.active .exit{display:block}
#fsBtn.active .enter{display:none}
#muteBtn .on{display:none}
#muteBtn.unmuted .on{display:block}
#muteBtn.unmuted .off{display:none}
.stage:fullscreen{border-radius:0;border:0}
.stage:-webkit-full-screen{border-radius:0;border:0}
.hold svg{width:44px;height:44px;margin-bottom:8px;opacity:.7}
.hold .qr{display:none;width:max(96px,min(168px,40cqh,60cqw));aspect-ratio:1;margin-bottom:12px;background:#fff;border-radius:12px;overflow:hidden;flex:none}
.hold.has-qr .qr{display:block}
.hold .qrcap{display:none;margin:0 0 14px;max-width:22em;font-size:13px;line-height:1.5;color:#C5CCDA}
.hold.has-qr .qrcap{display:block}
.hold.has-qr .ico{display:none}
.hold strong{font-size:16px;font-weight:500;color:#C5CCDA}
.hold .hint{font-size:13px}
.hold.has-qr strong,.hold.has-qr .hint{display:none}
.hold .qr svg{display:block;width:100%;height:100%;margin:0;opacity:1}
@container (max-height:280px){
  .hold.has-qr .qrcap{display:none}
  .hold.has-qr .qr{margin-bottom:0}
}
.stage.live .hold{display:none}

.note{margin:clamp(12px,2.4vh,20px) 0 0;color:var(--sub);font-size:13px;max-width:38em}

@media (max-height:640px){
  .lead{display:none}
  .hold .hint{display:none}
}
@media (max-width:760px){
  .vcard .lead{display:none}
  .vcard .row{flex:1 1 100%}
  .vcard .actions .ghost{flex:1}
}
@media (max-width:560px){
  .shell{padding:12px 14px}
  .card{border-radius:22px}
  .stage{border-radius:18px}
  .main{width:100%}
  .row{flex-direction:column;align-items:stretch}
  .pill{justify-content:center}
  .actions .ghost{flex:1}
}
@media (max-width:560px){
  .top{flex-wrap:nowrap;gap:8px}
  .brand{gap:6px;font-size:17px;min-width:0;white-space:nowrap}
  .brand .site-icon{font-size:22px}
  .top-right{flex-wrap:nowrap;gap:6px;flex:none}
  .install{height:36px;padding:0 12px;gap:5px;font-size:12px;white-space:nowrap}
  .switch{padding:3px}
  .seg{padding:6px 12px;font-size:13px}
}
@media (max-width:400px){
  .install{width:36px;padding:0;justify-content:center}
  .install span{display:none}
}
@media (max-width:330px){
  .brand{font-size:15px}
  .brand .site-icon{font-size:20px}
  .seg{padding:6px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .tile.flip,.dot.ok.pulse{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <i class="fa-brands fa-chromecast site-icon" aria-hidden="true"></i>
      <span>SimpleCast</span>
    </div>
    <div class="top-right">
      <button class="install" id="installBtn" type="button" aria-label="インストール" title="インストール"><i class="fa-solid fa-download" aria-hidden="true"></i><span>インストール</span></button>
      <div class="switch" role="tablist" aria-label="モード">
        <button class="seg" role="tab" data-tab="viewer" aria-selected="true">受信</button>
        <button class="seg" role="tab" data-tab="sender" aria-selected="false">送信</button>
      </div>
    </div>
  </header>

  <section class="panel active" id="viewer">
    <div class="card vcard">
      <div class="vinfo">
        <h2>この画面に映す</h2>
        <p class="lead">共有したい端末でSimpleCastを開き、「送信」に右のコードを入力してください。</p>
      </div>
      <div class="tiles" id="codeTiles" aria-live="polite">
        <span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span>
        <span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span>
      </div>
      <div class="row">
        <div class="pill"><span class="dot" id="vdot"></span><span id="vstatus">接続中…</span></div>
        <div class="actions">
          <button class="ghost" id="copyCode" disabled>コードをコピー</button>
          <button class="ghost" id="copyLink" disabled>リンクをコピー</button>
        </div>
      </div>
    </div>
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="hold" id="hold">
        <div class="qr" id="qr" role="img" aria-label="接続用のQRコード"></div>
        <p class="qrcap">共有する端末でこのQRコードを読み取ると、コードが入力された状態で送信画面が開きます。</p>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <strong>まだ何も映っていません</strong>
        <span class="hint">送信側が共有を始めると、ここに表示されます。映像が始まったら、マウスを動かすと表示されるボタンで音を出せます。</span>
      </div>
      <div class="ctl">
        <button id="muteBtn" aria-label="ミュートを解除" title="ミュートを解除">
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        </button>
        <button id="fsBtn" aria-label="全画面表示" title="全画面表示">
          <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="panel" id="sender">
    <div class="card">
      <h2>この端末の画面を送る</h2>
      <p class="lead">受信側に表示されているコードを入力してください。</p>
      <div class="tiles" id="cells"></div>
      <div class="row">
        <div class="pill"><span class="dot" id="sdot"></span><span id="sstatus">待機中</span></div>
        <button class="main" id="go">共有を開始</button>
      </div>
      <p class="note">PCのブラウザで利用できます。スマートフォンのブラウザは、画面の送信に対応していないことが多いです。</p>
    </div>
  </section>
</div>

<script>
const WORKER_HOST = "simple-cast.user-x45.workers.dev";

const ICE = { iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }, { urls: "stun:stun.l.google.com:19302" }] };
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function wsUrl(code, role) {
  return "wss://" + WORKER_HOST + "/ws?code=" + code + "&role=" + role;
}

function tuneOpus(sdp) {
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/);
  if (!m) return sdp;
  const pt = m[1];
  const wanted = ["stereo=1", "sprop-stereo=1", "maxaveragebitrate=510000", "useinbandfec=1", "usedtx=0"];
  const re = new RegExp("a=fmtp:" + pt + " ([^\\r\\n]*)");
  if (re.test(sdp)) {
    return sdp.replace(re, function (line, params) {
      const keep = params.split(";").filter(function (p) {
        return !/^(stereo|sprop-stereo|maxaveragebitrate|usedtx|useinbandfec|cbr)=/.test(p);
      });
      return "a=fmtp:" + pt + " " + keep.concat(wanted).join(";");
    });
  }
  return sdp.replace(m[0], m[0] + "\r\na=fmtp:" + pt + " " + wanted.join(";"));
}

function setStatus(dotId, textId, text, state) {
  document.getElementById(textId).textContent = text;
  const dot = document.getElementById(dotId);
  dot.className = "dot" + (state ? " " + state : "") + (state === "ok" ? " pulse" : "");
}

function generateCode() {
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  let out = "";
  for (let i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
  return out;
}

const viewer = { ws: null, pc: null, code: "", started: false };
const sender = { ws: null, pc: null, stream: null, rotate: 0, pending: null, probe: null, watch: null };

function senderFrameSize() {
  const v = sender.probe;
  if (v && v.videoWidth && v.videoHeight) return { w: v.videoWidth, h: v.videoHeight };
  const track = sender.stream && sender.stream.getVideoTracks()[0];
  const settings = track && track.getSettings ? track.getSettings() : {};
  return { w: settings.width || 0, h: settings.height || 0 };
}

function computeSenderRotation() {
  if (!/\bCrOS\b/.test(navigator.userAgent)) return 0;
  const track = sender.stream && sender.stream.getVideoTracks()[0];
  const settings = track && track.getSettings ? track.getSettings() : {};
  if (settings.displaySurface !== "monitor") return 0;
  const f = senderFrameSize();
  const sw = screen.width;
  const sh = screen.height;
  if (!f.w || !f.h || !sw || !sh) return 0;
  const frameRatio = f.w / f.h;
  const screenRatio = sw / sh;
  if (Math.abs(Math.log(frameRatio)) < 0.1 || Math.abs(Math.log(screenRatio)) < 0.1) return 0;
  if ((frameRatio > 1) === (screenRatio > 1)) return 0;
  if (Math.abs(Math.log(frameRatio * screenRatio)) > 0.1) return 0;
  const angle = screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : 90;
  if (angle === 90) return 90;
  if (angle === 270) return 270;
  return 0;
}

function updateSenderRotation(immediate) {
  const next = computeSenderRotation();
  if (next === sender.rotate) {
    sender.pending = null;
    return;
  }
  if (immediate === true || next === sender.pending) {
    sender.rotate = next;
    sender.pending = null;
    if (sender.ws && sender.ws.readyState === 1) {
      sender.ws.send(JSON.stringify({ type: "rotate", rotate: next }));
    }
  } else {
    sender.pending = next;
  }
}

function startRotationWatch() {
  stopRotationWatch();
  const track = sender.stream.getVideoTracks()[0];
  const probe = document.createElement("video");
  probe.muted = true;
  probe.playsInline = true;
  probe.srcObject = new MediaStream([track]);
  probe.play().catch(function () {});
  sender.probe = probe;
  sender.rotate = computeSenderRotation();
  sender.pending = null;
  sender.watch = setInterval(updateSenderRotation, 500);
}

function stopRotationWatch() {
  if (sender.watch) {
    clearInterval(sender.watch);
    sender.watch = null;
  }
  if (sender.probe) {
    sender.probe.srcObject = null;
    sender.probe = null;
  }
  sender.pending = null;
}

function applyViewerRotation(deg) {
  const stage = document.getElementById("stage");
  stage.classList.remove("rot90", "rot180", "rot270");
  if (deg === 90 || deg === 180 || deg === 270) stage.classList.add("rot" + deg);
}

function activateTab(name) {
  document.querySelectorAll(".seg").forEach(function (s) {
    s.setAttribute("aria-selected", s.dataset.tab === name ? "true" : "false");
  });
  document.querySelectorAll(".panel").forEach(function (p) {
    p.classList.toggle("active", p.id === name);
  });
  if (name === "viewer" && !viewer.started) startViewer();
}

document.querySelectorAll(".seg").forEach(function (seg) {
  seg.addEventListener("click", function () { activateTab(seg.dataset.tab); });
});

const installBtn = document.getElementById("installBtn");
let installEvent = null;

window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  installEvent = e;
  installBtn.classList.add("show");
});

installBtn.addEventListener("click", async function () {
  if (!installEvent) return;
  const ev = installEvent;
  installEvent = null;
  installBtn.classList.remove("show");
  try {
    await ev.prompt();
    await ev.userChoice;
  } catch (e) {}
});

window.addEventListener("appinstalled", function () {
  installEvent = null;
  installBtn.classList.remove("show");
});

function viewerLink(code) {
  return location.origin + location.pathname + "#" + code;
}

function renderQr(code) {
  const box = document.getElementById("qr");
  const hold = document.getElementById("hold");
  if (!code || typeof qrcode !== "function") {
    box.innerHTML = "";
    hold.classList.remove("has-qr");
    return;
  }
  try {
    const qr = qrcode(0, "M");
    qr.addData(viewerLink(code));
    qr.make();
    const n = qr.getModuleCount();
    const m = 4;
    const size = n + m * 2;
    let d = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
      }
    }
    box.innerHTML = '<svg viewBox="0 0 ' + size + " " + size + '" shape-rendering="crispEdges" aria-hidden="true"><rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
    hold.classList.add("has-qr");
  } catch (e) {
    box.innerHTML = "";
    hold.classList.remove("has-qr");
  }
}

function setViewerCode(code) {
  viewer.code = code;
  renderQr(code);
  document.querySelectorAll("#codeTiles .tile").forEach(function (tile, i) {
    tile.querySelector("b").textContent = code ? code[i] : "";
    tile.classList.remove("flip");
    if (code) {
      void tile.offsetWidth;
      tile.style.animationDelay = i * 70 + "ms";
      tile.classList.add("flip");
    }
  });
  document.getElementById("copyCode").disabled = !code;
  document.getElementById("copyLink").disabled = !code;
}

function flashLabel(btn, text) {
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = text;
  setTimeout(function () { btn.textContent = original; }, 1500);
}

document.getElementById("copyCode").addEventListener("click", function (e) {
  if (!viewer.code) return;
  navigator.clipboard.writeText(viewer.code).then(function () { flashLabel(e.target, "コピーしました"); });
});

document.getElementById("copyLink").addEventListener("click", function (e) {
  if (!viewer.code) return;
  const link = viewerLink(viewer.code);
  navigator.clipboard.writeText(link).then(function () { flashLabel(e.target, "コピーしました"); });
});

document.getElementById("muteBtn").addEventListener("click", function () {
  const video = document.getElementById("video");
  video.muted = !video.muted;
  this.classList.toggle("unmuted", !video.muted);
  const label = video.muted ? "ミュートを解除" : "ミュートにする";
  this.setAttribute("aria-label", label);
  this.title = label;
});

document.getElementById("fsBtn").addEventListener("click", function () {
  const stage = document.getElementById("stage");
  const video = document.getElementById("video");
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else if (stage.requestFullscreen) {
    stage.requestFullscreen().catch(function () {});
  } else if (stage.webkitRequestFullscreen) {
    stage.webkitRequestFullscreen();
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }
});

const stageEl = document.getElementById("stage");
const ctlEl = stageEl.querySelector(".ctl");
let ctlTimer = null;

function hideControls() {
  clearTimeout(ctlTimer);
  ctlTimer = null;
  stageEl.classList.remove("show-ctl");
}

function showControls() {
  stageEl.classList.add("show-ctl");
  clearTimeout(ctlTimer);
  ctlTimer = setTimeout(function tick() {
    if (ctlEl.matches(":hover") || ctlEl.querySelector(":focus-visible")) {
      ctlTimer = setTimeout(tick, 2500);
      return;
    }
    hideControls();
  }, 2500);
}

stageEl.addEventListener("pointermove", showControls);
stageEl.addEventListener("pointerdown", showControls);
stageEl.addEventListener("pointerleave", function (e) {
  if (e.pointerType === "mouse") hideControls();
});
document.addEventListener("fullscreenchange", showControls);
document.addEventListener("webkitfullscreenchange", showControls);

function updateFsButton() {
  const btn = document.getElementById("fsBtn");
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
  const label = on ? "全画面を終了" : "全画面表示";
  btn.classList.toggle("active", on);
  btn.setAttribute("aria-label", label);
  btn.title = label;
}

document.addEventListener("fullscreenchange", updateFsButton);
document.addEventListener("webkitfullscreenchange", updateFsButton);

function exitFullscreenIfNeeded() {
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(function () {});
  } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
    document.webkitExitFullscreen();
  }
}

function closeViewerPeer() {
  hideControls();
  exitFullscreenIfNeeded();
  if (viewer.pc) {
    viewer.pc.close();
    viewer.pc = null;
  }
  document.getElementById("video").srcObject = null;
  document.getElementById("stage").classList.remove("live", "rot90", "rot180", "rot270");
  document.getElementById("viewer").classList.remove("live");
}

async function viewerOnMessage(msg) {
  if (msg.type === "peer-joined") {
    closeViewerPeer();
    setStatus("vdot", "vstatus", "接続処理中…", "");
    const pc = new RTCPeerConnection(ICE);
    viewer.pc = pc;
    pc.ontrack = function (e) {
      const video = document.getElementById("video");
      if (video.srcObject !== e.streams[0]) video.srcObject = e.streams[0];
      document.getElementById("stage").classList.add("live");
      document.getElementById("viewer").classList.add("live");
    };
    pc.onicecandidate = function (e) {
      if (e.candidate && viewer.ws && viewer.ws.readyState === 1) {
        viewer.ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
      }
    };
    pc.onconnectionstatechange = function () {
      if (pc.connectionState === "connected") setStatus("vdot", "vstatus", "受信中", "ok");
      if (pc.connectionState === "failed") {
        if (viewer.pc === pc) closeViewerPeer();
        setStatus("vdot", "vstatus", "接続に失敗しました", "ng");
      }
    };
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    const offer = await pc.createOffer();
    await pc.setLocalDescription({ type: "offer", sdp: tuneOpus(offer.sdp) });
    viewer.ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription }));
  } else if (msg.type === "answer" && viewer.pc) {
    applyViewerRotation(msg.rotate);
    await viewer.pc.setRemoteDescription(msg.sdp);
  } else if (msg.type === "rotate" && viewer.pc) {
    applyViewerRotation(msg.rotate);
  } else if (msg.type === "candidate" && viewer.pc) {
    try { await viewer.pc.addIceCandidate(msg.candidate); } catch (e) {}
  } else if (msg.type === "peer-left") {
    closeViewerPeer();
    setStatus("vdot", "vstatus", "共有が終了しました。次の接続を待っています", "ok");
  }
}

function startViewer() {
  viewer.started = true;
  const code = generateCode();
  let opened = false;
  const ws = new WebSocket(wsUrl(code, "viewer"));
  viewer.ws = ws;
  let chain = Promise.resolve();
  ws.onopen = function () {
    opened = true;
    setViewerCode(code);
    setStatus("vdot", "vstatus", "送信側の接続を待っています", "ok");
  };
  ws.onmessage = function (e) {
    const msg = JSON.parse(e.data);
    chain = chain.then(function () { return viewerOnMessage(msg); }).catch(function () {});
  };
  ws.onclose = function () {
    closeViewerPeer();
    setViewerCode("");
    setStatus("vdot", "vstatus", opened ? "切断されました。再接続しています…" : "接続しています…", "ng");
    setTimeout(startViewer, 1500);
  };
}

const cellsBox = document.getElementById("cells");
const cells = [];

for (let i = 0; i < 6; i++) {
  const tile = document.createElement("span");
  tile.className = "tile";
  const input = document.createElement("input");
  input.maxLength = 1;
  input.autocomplete = "off";
  input.autocapitalize = "characters";
  input.spellcheck = false;
  input.setAttribute("aria-label", "コード" + (i + 1) + "文字目");
  tile.appendChild(input);
  cellsBox.appendChild(tile);
  cells.push(input);
}

function cleanChar(v) {
  return v.toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function fillCells(text, start) {
  const chars = cleanChar(text).split("");
  let last = start;
  for (let k = 0; k < chars.length && start + k < 6; k++) {
    cells[start + k].value = chars[k];
    last = start + k;
  }
  cells[Math.min(last + 1, 5)].focus();
}

function getSenderCode() {
  return cells.map(function (c) { return c.value; }).join("");
}

function setSenderLocked(locked) {
  cells.forEach(function (c) { c.disabled = locked; });
}

cells.forEach(function (cell, i) {
  cell.addEventListener("input", function () {
    const v = cleanChar(cell.value);
    cell.value = v.slice(-1);
    if (cell.value && i < 5) cells[i + 1].focus();
  });
  cell.addEventListener("keydown", function (e) {
    if (e.key === "Backspace" && !cell.value && i > 0) {
      e.preventDefault();
      cells[i - 1].value = "";
      cells[i - 1].focus();
    } else if (e.key === "ArrowLeft" && i > 0) {
      cells[i - 1].focus();
    } else if (e.key === "ArrowRight" && i < 5) {
      cells[i + 1].focus();
    } else if (e.key === "Enter") {
      document.getElementById("go").click();
    }
  });
  cell.addEventListener("focus", function () { cell.select(); });
  cell.addEventListener("paste", function (e) {
    e.preventDefault();
    fillCells((e.clipboardData || window.clipboardData).getData("text"), i);
  });
});

function stopSender() {
  if (sender.stream) {
    sender.stream.getTracks().forEach(function (t) { t.onended = null; t.stop(); });
    sender.stream = null;
  }
  stopRotationWatch();
  sender.rotate = 0;
  if (sender.pc) {
    sender.pc.close();
    sender.pc = null;
  }
  if (sender.ws) {
    sender.ws.onclose = null;
    try { sender.ws.close(); } catch (e) {}
    sender.ws = null;
  }
  const btn = document.getElementById("go");
  btn.textContent = "共有を開始";
  btn.classList.remove("stop");
  btn.disabled = false;
  setSenderLocked(false);
}

async function senderOnMessage(msg) {
  if (msg.type === "offer") {
    if (sender.pc) sender.pc.close();
    const pc = new RTCPeerConnection(ICE);
    sender.pc = pc;
    sender.stream.getTracks().forEach(function (t) { pc.addTrack(t, sender.stream); });
    updateSenderRotation(true);
    pc.onicecandidate = function (e) {
      if (e.candidate && sender.ws && sender.ws.readyState === 1) {
        sender.ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
      }
    };
    pc.onconnectionstatechange = function () {
      if (pc.connectionState === "connected") setStatus("sdot", "sstatus", "共有中", "ok");
      if (pc.connectionState === "failed") setStatus("sdot", "sstatus", "接続に失敗しました", "ng");
    };
    await pc.setRemoteDescription(msg.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription({ type: "answer", sdp: tuneOpus(answer.sdp) });
    sender.ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription, rotate: sender.rotate }));
    pc.getSenders().forEach(function (s) {
      if (!s.track) return;
      const params = s.getParameters();
      if (!params.encodings || !params.encodings.length) params.encodings = [{}];
      if (s.track.kind === "audio") {
        params.encodings[0].maxBitrate = 256000;
      } else {
        params.encodings[0].maxBitrate = 12000000;
        params.encodings[0].maxFramerate = 60;
        params.degradationPreference = "balanced";
      }
      s.setParameters(params).catch(function () {});
    });
  } else if (msg.type === "candidate" && sender.pc) {
    try { await sender.pc.addIceCandidate(msg.candidate); } catch (e) {}
  }
}

async function checkCode(code) {
  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, 4000);
  try {
    const res = await fetch("https://" + WORKER_HOST + "/check?code=" + code, { cache: "no-store", signal: controller.signal });
    if (res.ok) return "ok";
    if (res.status === 404) return "not-found";
    if (res.status === 409) return "in-use";
    if (res.status === 400) return "invalid";
    return "error";
  } catch (e) {
    return "error";
  } finally {
    clearTimeout(timer);
  }
}

async function startSender() {
  const code = getSenderCode();
  if (!/^[A-Z0-9]{6}$/.test(code)) {
    setStatus("sdot", "sstatus", "6文字のコードを入力してください", "ng");
    return;
  }
  const btn = document.getElementById("go");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    setStatus("sdot", "sstatus", "このブラウザは画面の送信に対応していません", "ng");
    return;
  }
  btn.disabled = true;
  setStatus("sdot", "sstatus", "コードを確認しています…", "");
  const result = await checkCode(code);
  btn.disabled = false;
  if (result !== "ok") {
    const messages = {
      "not-found": "コードが見つかりません。受信側の表示を確認してください",
      "in-use": "このコードはすでに使用中です",
      "invalid": "コードの形式が正しくありません",
      "error": "コードを確認できませんでした。通信環境を確認してください"
    };
    setStatus("sdot", "sstatus", messages[result], "ng");
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 60, max: 60 }
      },
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 2,
        sampleRate: 48000
      }
    });
  } catch (e) {
    setStatus("sdot", "sstatus", "画面の選択がキャンセルされました", "ng");
    return;
  }
  stream.getAudioTracks().forEach(function (t) { t.contentHint = "music"; });
  sender.stream = stream;
  startRotationWatch();
  btn.disabled = true;
  setSenderLocked(true);
  setStatus("sdot", "sstatus", "接続しています…", "");
  stream.getVideoTracks()[0].onended = function () {
    stopSender();
    setStatus("sdot", "sstatus", "共有を停止しました", "");
  };
  let opened = false;
  const ws = new WebSocket(wsUrl(code, "sender"));
  sender.ws = ws;
  let chain = Promise.resolve();
  ws.onopen = function () {
    opened = true;
    btn.disabled = false;
    btn.textContent = "共有を停止";
    btn.classList.add("stop");
    setStatus("sdot", "sstatus", "受信側と接続しています…", "");
  };
  ws.onmessage = function (e) {
    const msg = JSON.parse(e.data);
    chain = chain.then(function () { return senderOnMessage(msg); }).catch(function () {});
  };
  ws.onclose = function () {
    stopSender();
    setStatus("sdot", "sstatus", opened ? "切断されました" : "コードが見つからないか、すでに使用中です", "ng");
  };
}

document.getElementById("go").addEventListener("click", function () {
  if (sender.ws) {
    stopSender();
    setStatus("sdot", "sstatus", "共有を停止しました", "");
  } else {
    startSender();
  }
});

const hashCode = cleanChar(location.hash.slice(1));
if (hashCode.length === 6) {
  activateTab("sender");
  fillCells(hashCode, 0);
  cells[5].blur();
  history.replaceState(null, "", location.pathname);
} else {
  activateTab("viewer");
}
</script>
