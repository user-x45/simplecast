<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleCast</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--text:#e8eaed;--sub:#9aa0a6;--accent:#4f8cff;--ok:#34c759;--ng:#ff5f57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{font-size:22px;margin:0 0 16px;letter-spacing:.02em}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{background:var(--card);color:var(--sub);border:1px solid #2b303a;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none;width:100%;max-width:960px;flex-direction:column;align-items:center;gap:16px}
.panel.active{display:flex}
.card{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:480px;text-align:center}
.label{color:var(--sub);font-size:13px;margin-bottom:8px}
.code{font-size:48px;font-weight:700;letter-spacing:.2em;font-family:ui-monospace,Menlo,monospace;padding-left:.2em;user-select:all}
.status{font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sub)}
.dot.ok{background:var(--ok)}
.dot.ng{background:var(--ng)}
.stage{width:100%;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:none}
.stage.on{display:block}
video{width:100%;height:100%;object-fit:contain;background:#000}
input{width:100%;background:var(--bg);border:1px solid #2b303a;color:var(--text);border-radius:12px;padding:14px;font-size:28px;text-align:center;letter-spacing:.2em;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;margin-bottom:14px}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button.main{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
button.main.stop{background:var(--ng)}
button.main:disabled{opacity:.5;cursor:default}
.note{color:var(--sub);font-size:12px;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<h1>SimpleCast</h1>
<div class="tabs">
<button class="tab active" data-tab="viewer">受信（画面を表示）</button>
<button class="tab" data-tab="sender">送信（画面を共有）</button>
</div>

<section class="panel active" id="viewer">
<div class="card">
<div class="label">招待コード</div>
<div class="code" id="code">------</div>
<div class="status" style="margin-top:16px"><span class="dot" id="vdot"></span><span id="vstatus">接続中…</span></div>
<div class="note">共有したい端末でこのページを開き、「送信」タブでこのコードを入力してください。</div>
</div>
<div class="stage" id="stage"><video id="video" autoplay playsinline muted controls></video></div>
</section>

<section class="panel" id="sender">
<div class="card">
<div class="label">受信側に表示されている招待コード</div>
<input id="input" maxlength="6" placeholder="------" autocomplete="off" autocapitalize="characters" spellcheck="false">
<button class="main" id="go">共有を開始</button>
<div class="status" style="margin-top:16px"><span class="dot" id="sdot"></span><span id="sstatus">待機中</span></div>
<div class="note">PCのブラウザで利用できます。スマートフォンのブラウザは画面共有の送信に対応していないことが多いです。</div>
</div>
</section>

<script>
const WORKER_HOST = "simple-cast.user-x45.workers.dev";

const ICE = { iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }, { urls: "stun:stun.l.google.com:19302" }] };
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function wsUrl(code, role) {
  return "wss://" + WORKER_HOST + "/ws?code=" + code + "&role=" + role;
}

function setStatus(dotId, textId, text, state) {
  document.getElementById(textId).textContent = text;
  const dot = document.getElementById(dotId);
  dot.className = "dot" + (state ? " " + state : "");
}

document.querySelectorAll(".tab").forEach(function (tab) {
  tab.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab).classList.add("active");
  });
});

function generateCode() {
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  let out = "";
  for (let i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
  return out;
}

const viewer = { ws: null, pc: null };

function closeViewerPeer() {
  if (viewer.pc) {
    viewer.pc.close();
    viewer.pc = null;
  }
  const video = document.getElementById("video");
  video.srcObject = null;
  document.getElementById("stage").classList.remove("on");
}

async function viewerOnMessage(msg) {
  if (msg.type === "peer-joined") {
    closeViewerPeer();
    setStatus("vdot", "vstatus", "接続処理中…", "");
    const pc = new RTCPeerConnection(ICE);
    viewer.pc = pc;
    pc.ontrack = function (e) {
      const video = document.getElementById("video");
      if (video.srcObject !== e.streams[0]) video.srcObject = e.streams[0];
      document.getElementById("stage").classList.add("on");
    };
    pc.onicecandidate = function (e) {
      if (e.candidate && viewer.ws && viewer.ws.readyState === 1) {
        viewer.ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
      }
    };
    pc.onconnectionstatechange = function () {
      if (pc.connectionState === "connected") setStatus("vdot", "vstatus", "受信中", "ok");
      if (pc.connectionState === "failed") setStatus("vdot", "vstatus", "接続に失敗しました", "ng");
    };
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    viewer.ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription }));
  } else if (msg.type === "answer" && viewer.pc) {
    await viewer.pc.setRemoteDescription(msg.sdp);
  } else if (msg.type === "candidate" && viewer.pc) {
    try { await viewer.pc.addIceCandidate(msg.candidate); } catch (e) {}
  } else if (msg.type === "peer-left") {
    closeViewerPeer();
    setStatus("vdot", "vstatus", "共有が終了しました。待機中", "ok");
  }
}

function startViewer() {
  const code = generateCode();
  let opened = false;
  const ws = new WebSocket(wsUrl(code, "viewer"));
  viewer.ws = ws;
  let chain = Promise.resolve();
  ws.onopen = function () {
    opened = true;
    document.getElementById("code").textContent = code;
    setStatus("vdot", "vstatus", "送信側の接続を待っています", "ok");
  };
  ws.onmessage = function (e) {
    const msg = JSON.parse(e.data);
    chain = chain.then(function () { return viewerOnMessage(msg); }).catch(function () {});
  };
  ws.onclose = function () {
    closeViewerPeer();
    document.getElementById("code").textContent = "------";
    setStatus("vdot", "vstatus", opened ? "切断されました。再接続中…" : "接続中…", "ng");
    setTimeout(startViewer, 1500);
  };
}

const sender = { ws: null, pc: null, stream: null };

function stopSender() {
  if (sender.stream) {
    sender.stream.getTracks().forEach(function (t) { t.onended = null; t.stop(); });
    sender.stream = null;
  }
  if (sender.pc) {
    sender.pc.close();
    sender.pc = null;
  }
  if (sender.ws) {
    sender.ws.onclose = null;
    try { sender.ws.close(); } catch (e) {}
    sender.ws = null;
  }
  const btn = document.getElementById("go");
  btn.textContent = "共有を開始";
  btn.classList.remove("stop");
  btn.disabled = false;
  document.getElementById("input").disabled = false;
}

async function senderOnMessage(msg) {
  if (msg.type === "offer") {
    if (sender.pc) sender.pc.close();
    const pc = new RTCPeerConnection(ICE);
    sender.pc = pc;
    sender.stream.getTracks().forEach(function (t) { pc.addTrack(t, sender.stream); });
    pc.onicecandidate = function (e) {
      if (e.candidate && sender.ws && sender.ws.readyState === 1) {
        sender.ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
      }
    };
    pc.onconnectionstatechange = function () {
      if (pc.connectionState === "connected") setStatus("sdot", "sstatus", "共有中", "ok");
      if (pc.connectionState === "failed") setStatus("sdot", "sstatus", "接続に失敗しました", "ng");
    };
    await pc.setRemoteDescription(msg.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sender.ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription }));
  } else if (msg.type === "candidate" && sender.pc) {
    try { await sender.pc.addIceCandidate(msg.candidate); } catch (e) {}
  }
}

async function startSender() {
  const input = document.getElementById("input");
  const code = input.value.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) {
    setStatus("sdot", "sstatus", "6文字のコードを入力してください", "ng");
    return;
  }
  const btn = document.getElementById("go");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    setStatus("sdot", "sstatus", "このブラウザは画面共有に対応していません", "ng");
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch (e) {
    setStatus("sdot", "sstatus", "画面の選択がキャンセルされました", "ng");
    return;
  }
  sender.stream = stream;
  btn.disabled = true;
  input.disabled = true;
  setStatus("sdot", "sstatus", "接続中…", "");
  stream.getVideoTracks()[0].onended = function () {
    stopSender();
    setStatus("sdot", "sstatus", "共有を停止しました", "");
  };
  let opened = false;
  const ws = new WebSocket(wsUrl(code, "sender"));
  sender.ws = ws;
  let chain = Promise.resolve();
  ws.onopen = function () {
    opened = true;
    btn.disabled = false;
    btn.textContent = "共有を停止";
    btn.classList.add("stop");
    setStatus("sdot", "sstatus", "受信側と接続中…", "");
  };
  ws.onmessage = function (e) {
    const msg = JSON.parse(e.data);
    chain = chain.then(function () { return senderOnMessage(msg); }).catch(function () {});
  };
  ws.onclose = function () {
    stopSender();
    setStatus("sdot", "sstatus", opened ? "切断されました" : "コードが見つからないか、既に使用中です", "ng");
  };
}

document.getElementById("go").addEventListener("click", function () {
  if (sender.ws) {
    stopSender();
    setStatus("sdot", "sstatus", "共有を停止しました", "");
  } else {
    startSender();
  }
});

document.getElementById("input").addEventListener("input", function (e) {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});

startViewer();
</script>
</body>
</html>
